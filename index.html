<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmLab — Interactive B.Pharm Semester I Virtual Laboratory</title>
    <meta
      name="description"
      content="Interactive B.Pharm Semester I virtual laboratory covering BP101T–BP111P: annotated anatomy and chemistry diagrams, titration simulators, compounding calculators, pharmacognosy microscopy, and Python PK analysis."
    />
    <meta property="og:title" content="PharmLab — Interactive B.Pharm Semester I Virtual Laboratory" />
    <meta
      property="og:description"
      content="Curriculum-aligned B.Pharm Semester I practicals, 2D/3D annotated diagrams, calculators, and theory hub."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pharmlab_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-900 dark:selection:text-emerald-200 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
